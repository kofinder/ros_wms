# ==========================================================
# Gazebo <-> ROS 2 Bridge Configuration
# ==========================================================


# ==========================================================
# Simulation Clock
# Gazebo -> ROS
# Required when ROS nodes use: use_sim_time: true
# ==========================================================

- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS


# ==========================================================
# LiDAR
# Gazebo -> ROS
# ==========================================================

- ros_topic_name: "/scan"
  gz_topic_name: "/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS


# ==========================================================
# Velocity Command
# ROS -> Gazebo
# ==========================================================

- ros_topic_name: "/cmd_vel"
  gz_topic_name: "/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ


# ==========================================================
# Raw Wheel Odometry
# Gazebo -> ROS
# ==========================================================

- ros_topic_name: "/odom_raw"
  gz_topic_name: "/odom_raw"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS


# ==========================================================
# IMU
# Gazebo -> ROS
# ==========================================================

- ros_topic_name: "/imu/data"
  gz_topic_name: "/imu/data"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS


- ros_topic_name: "/joint_states"
  gz_topic_name: "/joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS


- ros_topic_name: "/front_steering_cmd"
  gz_topic_name: "/front_steering_cmd"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/front_drive_cmd"
  gz_topic_name: "/front_drive_cmd"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ