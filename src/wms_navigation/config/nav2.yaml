amcl:
  ros__parameters:
    use_sim_time: true

    # Frames
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_footprint

    # LiDAR
    scan_topic: /scan

    # Differential-drive robot
    robot_model_type: "nav2_amcl::DifferentialMotionModel"

    # Particle filter
    min_particles: 500
    max_particles: 2000

    # Laser model
    laser_model_type: likelihood_field
    laser_max_range: 10.0
    laser_min_range: 0.10
    max_beams: 60

    # Motion model noise
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    # Update thresholds
    update_min_d: 0.10
    update_min_a: 0.10

    # TF
    tf_broadcast: true
    transform_tolerance: 0.5

    # Initial pose
    set_initial_pose: true

    initial_pose:
      x: 0.5
      y: 0.0
      z: 0.0
      yaw: 0.0