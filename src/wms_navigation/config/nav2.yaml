amcl:
  ros__parameters:
    use_sim_time: true

    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_footprint
    scan_topic: /scan

    # AMCL Jazzy provides Differential and Omni motion models.
    # DifferentialMotionModel is appropriate here for a planar,
    # non-holonomic steer-drive robot using odometry in x / yaw.
    robot_model_type: "nav2_amcl::DifferentialMotionModel"

    min_particles: 500
    max_particles: 2000

    laser_model_type: likelihood_field
    laser_max_range: 10.0
    laser_min_range: 0.10
    max_beams: 60

    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    update_min_d: 0.10
    update_min_a: 0.10

    tf_broadcast: true
    transform_tolerance: 0.5

    # Safer for a saved SLAM map: initialize from RViz /initialpose
    # instead of assuming the Gazebo world origin equals the map origin.
    set_initial_pose: false

map_server:
  ros__parameters:
    use_sim_time: true
    # localization.launch.py should provide / override yaml_filename.
    yaml_filename: ""

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_smac_planner::SmacPlannerHybrid"
      tolerance: 0.25
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0
      motion_model_for_search: "DUBIN"
      angle_quantization_bins: 72
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0

      # wheelbase = 0.865 m, steering limit ~= 45 deg
      # R_min = L / tan(delta_max) ~= 0.865 m.
      # Use a small safety margin.
      minimum_turning_radius: 0.90

      reverse_penalty: 2.0
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      debug_visualizations: false
      use_quadratic_cost_penalty: false
      downsample_obstacle_heuristic: true
      allow_primitive_interpolation: false
      smooth_path: true

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

    failure_tolerance: 0.3

    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.20
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.20
      stateful: true

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      # Conservative first autonomous speed for the large AMR.
      desired_linear_vel: 0.30

      lookahead_dist: 0.70
      min_lookahead_dist: 0.40
      max_lookahead_dist: 1.00
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true

      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.80

      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0

      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.90
      regulated_linear_scaling_min_speed: 0.12

      use_cost_regulated_linear_velocity_scaling: false

      # IMPORTANT: this robot cannot rotate in place.
      use_rotate_to_heading: false
      allow_reversing: false

      transform_tolerance: 0.2
      max_robot_pose_search_dist: 10.0
      stateful: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 10.0
      publish_frequency: 5.0

      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true

      width: 4.0
      height: 4.0
      resolution: 0.05

      # STL bounding box ~= 1.441 x 1.044 m.
      # Add a small safety margin around the real body.
      footprint: "[[-0.75, -0.55], [-0.75, 0.55], [0.75, 0.55], [0.75, -0.55]]"

      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: true
          marking: true
          obstacle_max_range: 9.5
          obstacle_min_range: 0.10
          raytrace_max_range: 10.0
          raytrace_min_range: 0.10

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.30

      always_send_full_costmap: true


global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 2.0
      publish_frequency: 1.0

      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05
      track_unknown_space: true

      footprint: "[[-0.75, -0.55], [-0.75, 0.55], [0.75, 0.55], [0.75, -0.55]]"

      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: true
          marking: true
          obstacle_max_range: 9.5
          obstacle_min_range: 0.10
          raytrace_max_range: 10.0
          raytrace_min_range: 0.10

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.30

      always_send_full_costmap: true

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    transform_tolerance: 0.2

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0

    # Keep standard behaviors available for Nav2 BT compatibility.
    # We will later replace / disable in-place spin recovery for this
    # steer-drive platform because it cannot physically rotate in place.
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]

    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"

    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.2

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"

    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 0

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: ["simple_smoother"]

    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true